<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body,#root{height:100%;width:100%;overflow:hidden;}
body{font-family:system-ui,-apple-system,sans-serif;background:#fff;color:#111;}

/* Base vars — minimal/outline mode */
:root{
  --bg:#ffffff;
  --surface:#f7f7f7;
  --surface2:#efefef;
  --border:#e0e0e0;
  --text:#111111;
  --text2:#444444;
  --text3:#888888;
  --accent:#111111;
  --accent-fg:#ffffff;
  --radius:8px;
  --font:system-ui,-apple-system,sans-serif;
  --density:1;
}

/* Theme overrides applied via .theme-* on #root */
.theme-dusk{--bg:#1a1625;--surface:#231e33;--surface2:#2d2742;--border:#3d3560;--text:#e8e0f5;--text2:#b8afd5;--text3:#7a6fa0;--accent:#9b7fe8;--accent-fg:#fff;}
.theme-slate{--bg:#131720;--surface:#1c2130;--surface2:#252c40;--border:#333d55;--text:#dde4f0;--text2:#8896b0;--text3:#556080;--accent:#6b8cde;--accent-fg:#fff;}
.theme-ember{--bg:#1c1410;--surface:#261c14;--surface2:#33241a;--border:#4d3520;--text:#f0e0cc;--text2:#c09060;--text3:#806040;--accent:#e07830;--accent-fg:#fff;}
.theme-ocean{--bg:#0d1a20;--surface:#122030;--surface2:#182c40;--border:#1f4060;--text:#c0e8f5;--text2:#6aafc8;--text3:#3d7090;--accent:#30b8e0;--accent-fg:#fff;}
.theme-sage{--bg:#121a14;--surface:#182118;--surface2:#1f2d20;--border:#2a4030;--text:#c8e0c0;--text2:#78a870;--text3:#486848;--accent:#5aaa60;--accent-fg:#fff;}
.theme-rose{--bg:#1a1220;--surface:#221630;--surface2:#2c1e3d;--border:#402858;--text:#f0d0f0;--text2:#c080c0;--text3:#885088;--accent:#d060c8;--accent-fg:#fff;}
.theme-mint{--bg:#f0faf5;--surface:#e4f5ec;--surface2:#d8f0e3;--border:#b0dcc0;--text:#0d2a18;--text2:#2d6045;--text3:#5a9070;--accent:#1a9e60;--accent-fg:#fff;}
.theme-breeze{--bg:#f0f5ff;--surface:#e4ecfa;--surface2:#d8e4f5;--border:#b0c8e8;--text:#0d1e38;--text2:#2d4a78;--text3:#5a78aa;--accent:#2060d0;--accent-fg:#fff;}
.theme-sand{--bg:#faf5ec;--surface:#f5edd8;--surface2:#ede0c0;--border:#d8c89a;--text:#2a200c;--text2:#6a5020;--text3:#9a7840;--accent:#c08020;--accent-fg:#fff;}

/* Font variants */
.font-rounded{--font:"SF Pro Rounded",system-ui,sans-serif;}
.font-sharp{--font:"Inter","Helvetica Neue",sans-serif;}
.font-mono{--font:"SF Mono","Fira Code",monospace;}
.font-serif{--font:"Georgia","Times New Roman",serif;}

/* Density */
.density-compact{--density:0.8;}
.density-spacious{--density:1.25;}

/* Radius */
.radius-sharp{--radius:2px;}
.radius-medium{--radius:8px;}
.radius-rounded{--radius:16px;}
.radius-pill{--radius:999px;}

/* App shell */
.app{display:flex;flex-direction:column;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);}
.app-body{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:60px;}
.app-body::-webkit-scrollbar{width:0;}

/* Bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  height:60px;
  display:flex;align-items:stretch;
  background:var(--bg);
  border-top:1px solid var(--border);
  z-index:100;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:pointer;
  color:var(--text3);font-size:10px;font-weight:500;
  border:none;background:none;
  transition:color .15s;
}
.nav-item.active{color:var(--accent);}
.nav-icon{font-size:20px;line-height:1;}

/* Header */
.page-header{
  padding:16px 16px 8px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.page-title{font-size:22px;font-weight:700;color:var(--text);}
.page-sub{font-size:13px;color:var(--text3);}

/* Sub-nav */
.sub-nav{
  display:flex;overflow-x:auto;
  border-bottom:1px solid var(--border);
  padding:0 16px;gap:0;
}
.sub-nav::-webkit-scrollbar{display:none;}
.sub-tab{
  padding:10px 14px;font-size:13px;font-weight:500;
  color:var(--text3);cursor:pointer;
  border-bottom:2px solid transparent;
  white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;
  transition:color .15s,border-color .15s;
}
.sub-tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* Cards */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:calc(14px * var(--density));
  margin-bottom:10px;
}
.card-flat{background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:calc(12px * var(--density));margin-bottom:8px;}
.card-glass{background:var(--surface);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--radius);padding:calc(14px * var(--density));margin-bottom:10px;}

/* Stat row */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px;}
.stat-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center;}
.stat-val{font-size:20px;font-weight:700;color:var(--text);}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:2px;}

/* Progress bar */
.prog-wrap{background:var(--surface2);border-radius:999px;height:6px;overflow:hidden;margin:6px 0;}
.prog-bar{height:100%;background:var(--accent);border-radius:999px;transition:width .3s;}

/* XP bar */
.xp-bar-wrap{background:var(--surface2);border-radius:999px;height:8px;overflow:hidden;}
.xp-bar{height:100%;background:var(--accent);border-radius:999px;}

/* Pill badge */
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--border);color:var(--text2);background:var(--surface);}
.pill-accent{background:var(--accent);color:var(--accent-fg);border-color:transparent;}

/* List item */
.list-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}

/* Input */
.field{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;outline:none;}
.field:focus{border-color:var(--accent);}
.label{font-size:12px;color:var(--text3);margin-bottom:4px;display:block;}

/* Button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font);transition:opacity .15s;}
.btn:active{opacity:.75;}
.btn-primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;}
.btn-sm{padding:6px 12px;font-size:12px;}

/* Section heading */
.section-head{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin:16px 0 8px;}

/* Toggle */
.toggle{position:relative;width:40px;height:22px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-track{position:absolute;inset:0;background:var(--surface2);border-radius:999px;cursor:pointer;transition:background .2s;border:1px solid var(--border);}
.toggle input:checked+.toggle-track{background:var(--accent);border-color:transparent;}
.toggle-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s;}
.toggle input:checked~.toggle-thumb{transform:translateX(18px);}

/* Scroll pad */
.pad{padding:16px;}
.pad-x{padding:0 16px;}

/* Activity feed */
.feed-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.feed-icon{width:32px;height:32px;border-radius:var(--radius);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.feed-text{font-size:13px;color:var(--text);}
.feed-meta{font-size:11px;color:var(--text3);margin-top:2px;}

/* Simple bar chart */
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:80px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.bar-fill{width:100%;background:var(--accent);border-radius:4px 4px 0 0;opacity:.85;min-height:2px;}
.bar-lbl{font-size:10px;color:var(--text3);}

/* Settings */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
.setting-label{font-size:15px;color:var(--text);}
.setting-sub{font-size:12px;color:var(--text3);margin-top:2px;}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.theme-btn{padding:10px 6px;border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;text-align:center;font-size:11px;font-weight:600;background:var(--surface);color:var(--text);transition:border-color .15s;}
.theme-btn.selected{border-color:var(--accent);border-width:2px;}
.option-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.option-btn{padding:6px 12px;border-radius:var(--radius);border:1px solid var(--border);font-size:12px;cursor:pointer;background:var(--surface);color:var(--text2);transition:border-color .15s,background .15s;}
.option-btn.selected{border-color:var(--accent);color:var(--accent);background:var(--surface2);}

/* Donut placeholder */
.donut-wrap{display:flex;flex-direction:column;align-items:center;padding:12px 0;}
.donut-svg{width:140px;height:140px;}
</style>
</head>

const fmt$=(n)=>'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate=(d)=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const TITLES=['Rookie','Apprentice','Journeyman','Skilled','Expert','Master','Elite','Legend','Mythic','Godmode'];
const getTitle=(xp)=>TITLES[Math.min(Math.floor(xp/1000),TITLES.length-1)];
const getLvl=(xp,pxp=500)=>Math.floor(xp/pxp)+1;
const getXpPct=(xp,pxp=500)=>((xp%pxp)/pxp)*100;

// ─── Shared Components ────────────────────────────────────────────────────────
function ProgBar({pct,height=6,color}){
  return <div className="prog-wrap" style={{height}}>
    <div className="prog-bar" style={{width:pct+'%',background:color||undefined}}/>
  </div>;
}

function SimpleBarChart({data,getVal,getLabel,goal}){
  const max=Math.max(...data.map(getVal),goal||0);
  return <div className="bar-chart">
    {data.map((d,i)=>{
      const v=getVal(d);
      const pct=(v/max)*100;
      const hit=goal&&v>=goal;
      return <div key={i} className="bar-col">
        <div className="bar-fill" style={{height:pct+'%',background:hit?'#22a060':undefined}}/>
        <div className="bar-lbl">{getLabel(d)}</div>
      </div>;
    })}
  </div>;
}

function Toggle({checked,onChange}){
  return <label className="toggle">
    <input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)}/>
    <div className="toggle-track"/>
    <div className="toggle-thumb"/>
  </label>;
}

function Modal({title,onClose,children}){
  return <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:200,display:'flex',alignItems:'flex-end'}} onClick={onClose}>
    <div style={{background:'var(--bg)',borderRadius:'16px 16px 0 0',padding:'20px',width:'100%',maxHeight:'80vh',overflowY:'auto'}} onClick={e=>e.stopPropagation()}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <span style={{fontWeight:700,fontSize:17}}>{title}</span>
        <button onClick={onClose} style={{background:'none',border:'none',fontSize:20,cursor:'pointer',color:'var(--text3)'}}>✕</button>
      </div>
      {children}
    </div>
  </div>;

// ─── HOME TAB ─────────────────────────────────────────────────────────────────
function HomeTab(){
  const totalXp=2240;
  const finXp=1240,hlthXp=680,lifeXp=320;
  const title=getTitle(totalXp);
  const lvl=getLvl(totalXp,1000);
  const xpPct=((totalXp%1000)/1000)*100;
  return <div className="pad">
    {/* Profile hero */}
    <div className="card" style={{textAlign:'center',padding:'24px 16px'}}>
      <div style={{width:64,height:64,borderRadius:'50%',background:'var(--surface2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,margin:'0 auto 10px'}}>🧑</div>

      <ProgBar pct={xpPct}/>
    </div>

    {/* Pillar cards */}
    <div className="stat-grid-3">
      {[{label:'Finance',xp:finXp,icon:'💰',pxp:500},{label:'Health',xp:hlthXp,icon:'❤️',pxp:500},{label:'Life',xp:lifeXp,icon:'🌱',pxp:500}].map(p=>(
        <div key={p.label} className="stat-box">
          <div style={{fontSize:22}}>{p.icon}</div>

function FinanceSpending(){
  const total=BUDGET_CATS.reduce((s,c)=>s+c.spent,0);
  const [sel,setSel]=useState(null);
  const colors=['#555','#777','#999','#bbb','#ccc','#ddd','#aaa','#888','#666'];
  let offset=0;
  const slices=BUDGET_CATS.map((c,i)=>{
    const pct=c.spent/total;
    const angle=pct*360;
    const s={...c,pct,angle,offset,color:colors[i]};
    offset+=angle;
    return s;
  });
  const r=60,cx=70,cy=70;
  const toRad=d=>d*Math.PI/180;
  const arc=(startDeg,endDeg)=>{
    const x1=cx+r*Math.sin(toRad(startDeg));
    const y1=cy-r*Math.cos(toRad(startDeg));
    const x2=cx+r*Math.sin(toRad(endDeg));
    const y2=cy-r*Math.cos(toRad(endDeg));
    const large=endDeg-startDeg>180?1:0;
    return `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
  };
  return <div className="pad">
    <div className="donut-wrap">
      <svg viewBox="0 0 140 140" width="160" height="160">
        {slices.map((s,i)=>(
          <path key={i} d={arc(s.offset,s.offset+s.angle)} fill={s.color} opacity={sel===i?1:.7} onClick={()=>setSel(sel===i?null:i)} style={{cursor:'pointer'}}/>
        ))}
        <circle cx={cx} cy={cy} r={38} fill="var(--bg)"/>
        <text x={cx} y={cy-4} textAnchor="middle" fontSize="10" fill="var(--text3)">Total</text>
        <text x={cx} y={cy+10} textAnchor="middle" fontSize="12" fontWeight="700" fill="var(--text)">{fmt$(total)}</text>
      </svg>
    </div>
    {sel!==null&&(
      <div className="card" style={{marginBottom:12}}>
        <div style={{fontWeight:700}}>{slices[sel].icon} {slices[sel].name}</div>
        <div style={{fontSize:13,color:'var(--text3)',marginTop:4}}>{fmt$(slices[sel].spent)} spent · {(slices[sel].pct*100).toFixed(1)}% of total</div>
        <ProgBar pct={Math.min((slices[sel].spent/slices[sel].budget)*100,100)}/>
        <div style={{fontSize:12,color:'var(--text3)'}}>Budget: {fmt$(slices[sel].budget)}</div>
      </div>
    )}
    {BUDGET_CATS.map((b,i)=>(
      <div key={b.name} className="list-item" style={{cursor:'pointer'}} onClick={()=>setSel(sel===i?null:i)}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:10,height:10,borderRadius:2,background:colors[i],flexShrink:0}}/>
          <span style={{fontSize:14}}>{b.icon} {b.name}</span>
        </div>
        <span style={{fontSize:14,fontWeight:600}}>{fmt$(b.spent)}</span>
      </div>
    ))}
  </div>;
}

    const updated=[w,...workouts];setWorkouts(updated);save('lt_h_workouts',updated);setAdding(false);
  };
  return <div className="pad">
    <button className="btn btn-primary" style={{width:'100%',marginBottom:12}} onClick={()=>setAdding(true)}>+ Log Workout</button>

            <div>
              <div style={{fontWeight:600}}>{w.type}</div>
              <div style={{fontSize:12,color:'var(--text3)'}}>{fmtDate(w.date)} · {w.duration} min</div>
              {w.notes&&<div style={{fontSize:12,color:'var(--text2)',marginTop:4}}>{w.notes}</div>}
            </div>
          </div>
          <span className="pill">+{w.xp} XP</span>
        </div>
      </div>
    ))}
    {adding&&<Modal title="Log Workout" onClose={()=>setAdding(false)}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:14}}>
        {types.map(t=><button key={t.n} className={`btn${form.type===t.n?' btn-primary':''}`} onClick={()=>setForm({...form,type:t.n})} style={{flexDirection:'column',gap:4,padding:'10px 4px'}}>
          <span style={{fontSize:20}}>{t.i}</span><span style={{fontSize:11}}>{t.n}</span>
        </button>)}
      </div>
      <label className="label">Duration (min)</label>
      <input className="field" type="number" value={form.duration} onChange={e=>setForm({...form,duration:+e.target.value})} style={{marginBottom:10}}/>
      <label className="label">Notes</label>
      <input className="field" placeholder="Optional notes..." value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} style={{marginBottom:14}}/>

    </Modal>}
  </div>;
}

function LifeSkills(){
  const [skills,setSkills]=useState(load('lt_life_skills',SEED_SKILLS));
  const [catFilter,setCatFilter]=useState('All');
  const [detail,setDetail]=useState(null);
  const [logging,setLogging]=useState(null);

  const cats=['All','Music','Tech','Language','Health','Art','Life','Mind'];
  const filtered=catFilter==='All'?skills:skills.filter(s=>s.cat===catFilter);

  const logSession=()=>{
    const xp=Math.round(logMin*0.5);
    const updated=skills.map(s=>s.id===logging.id?{...s,xp:s.xp+xp,sessions:s.sessions+1,totalMin:s.totalMin+logMin}:s);
    setSkills(updated);save('lt_life_skills',updated);setLogging(null);setLogNotes('');setLogMin(30);
  };

  return <div className="pad">
    <div style={{overflowX:'auto',display:'flex',gap:6,marginBottom:12}}>
      {cats.map(c=><button key={c} className={`btn btn-sm${catFilter===c?' btn-primary':''}`} onClick={()=>setCatFilter(c)}>{c}</button>)}
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:8}}>
      {filtered.map(s=>(
        <div key={s.id} className="card" style={{cursor:'pointer'}} onClick={()=>setDetail(s)}>
          <div style={{fontSize:28,marginBottom:6}}>{s.icon}</div>
          <div style={{fontWeight:600,fontSize:14}}>{s.name}</div>
          <div style={{fontSize:11,color:'var(--text3)',marginBottom:6}}>Lvl {s.level} · {s.xp} XP</div>
          <ProgBar pct={(s.xp%200)/200*100} height={4}/>
          <div style={{fontSize:11,color:'var(--text3)',marginTop:4}}>{s.sessions} sessions</div>
        </div>
      ))}
    </div>
    {detail&&<Modal title={detail.icon+' '+detail.name} onClose={()=>setDetail(null)}>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:13,color:'var(--text3)'}}>Level {detail.level} · {detail.xp} XP · {detail.sessions} sessions</div>
        <ProgBar pct={(detail.xp%200)/200*100}/>
        <div style={{fontSize:12,color:'var(--text3)',marginTop:4}}>Goal: {detail.goal}</div>
      </div>
      <div style={{fontSize:13,marginBottom:4}}>Total time: {Math.floor(detail.totalMin/60)}h {detail.totalMin%60}m</div>
      <button className="btn btn-primary" style={{width:'100%'}} onClick={()=>{setLogging(detail);setDetail(null);}}>Log Session</button>
    </Modal>}
    {logging&&<Modal title={'Log — '+logging.name} onClose={()=>setLogging(null)}>
      <label className="label">Duration (minutes)</label>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
        <button className="btn btn-sm" onClick={()=>setLogMin(Math.max(5,logMin-5))}>−</button>
        <span style={{fontWeight:700,fontSize:20,flex:1,textAlign:'center'}}>{logMin} min</span>
        <button className="btn btn-sm" onClick={()=>setLogMin(logMin+5)}>+</button>
      </div>
      <div style={{fontSize:12,color:'var(--text3)',marginBottom:12}}>XP earned: +{Math.round(logMin*0.5)}</div>
      <label className="label">Notes</label>
      <input className="field" placeholder="What did you work on?" value={logNotes} onChange={e=>setLogNotes(e.target.value)} style={{marginBottom:14}}/>
      <button className="btn btn-primary" style={{width:'100%'}} onClick={logSession}>Save Session</button>
    </Modal>}
  </div>;
}

  const setTheme=v=>{setThemeState(v);save('lt_settings_theme',v);};

  const setDensity=v=>{setDensityState(v);save('lt_settings_density',v);};

  const tabTitle={home:'Home',finance:'Finance',health:'Health',life:'Life',settings:'Settings'};

  return <div id="root-inner" className={rootClass}>

        <button key={n.id} className={`nav-item${tab===n.id?' active':''}`} onClick={()=>setTab(n.id)}>
          <span className="nav-icon">{n.icon}</span>
          <span>{n.label}</span>
        </button>
      ))}
    </nav>
  </div>;
}

// Apply root class to body wrapper
const rootEl=document.getElementById('root');
rootEl.style.cssText='height:100%;width:100%;';
ReactDOM.createRoot(rootEl).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
